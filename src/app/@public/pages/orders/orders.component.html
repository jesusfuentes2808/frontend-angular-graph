<div class="container" *ngIf="loading">
  <p>En este apartado encontraremos nuestros pedidas desde el más reciente</p>
  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col">
          Descripción
        </th>
        <th scope="col">
          Precio ({{currencySymol}})
        </th>
        <th scope="col">
          Fecha
        </th>
        <th scope="col">
          Más detalles
        </th>
      </tr>
    </thead>
    <tbody>
    <tr *ngFor="let data of charges">
      <td scope="col">
        {{data.description}}
      </td>
      <td scope="col">
        {{data.amount}}
      </td>
      <td scope="col">
        {{data.created | date: 'yyyy/MM/dd hh:mm:ss'}}
      </td>
      <td scope="col">
        <a href="{{data.receiptUrl}}" target="_blank">Factura</a>
      </td>
    </tr>
    </tbody>
  </table>
  <div class="row">
    <div class="col-lg text-center">
      <button *ngIf="loadMoreBtn" class="btn btn-dark" (click)="loadChargeData()">
        Cargar mas datos
      </button>
    </div>
  </div>
</div>
