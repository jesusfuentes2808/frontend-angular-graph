<button class="btn btn-success float-right mb-3 mr-2"
        (click)="manageAction('add','')"
>
  <i class="fa fa-plus-circle" style="margin-right: 10px"></i>Añadir
</button>
<select class="custom-select float-right mb-3 mr-2"
        style="width: auto"
        [(ngModel)]="filterActiveValues"
        (ngModelChange)="loadData()">
  <option [ngValue]="'ALL'">TODOS</option>
  <option [ngValue]="'ACTIVE'">Activos</option>
  <option [ngValue]="'INACTIVE'">Inactivos</option>
</select>
<div class="table table-responsive">
  <table class="table table-striped">
    <thead>
    <tr>
      <th scope="col" *ngFor="let column of tableColumns">{{column.label}}</th>
      <th>Gestionar información</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let data of data$ | async">
      <th scope="col" *ngFor="let val of tableColumns">
        <span *ngIf="val.property != 'active'; else activeValue">
          {{ data[val.property] }}
        </span>
        <ng-template #activeValue>
          <span *ngIf="data[val.property] === true">
            <i class="fas fa-check-circle"></i>
          </span>
          <span *ngIf="data[val.property] !== true">
            <i class="fas fa-times-circle"></i>
          </span>
        </ng-template>
      </th>
      <th scope="col" >
        <button class="btn btn-secondary mr-2"
                (click)="manageAction('edit', data)"
        >
          <i class="fa fa-edit" style="margin-right: 10px"></i>
        </button>
        <button class="btn btn-info mr-2"
                (click)="manageAction('info',data)"
        >
          <i class="fa fa-info" style="margin-right: 10px"></i>
        </button>



        <button
                *ngIf="data['active'] != false; else unblockButton"
                class="btn btn-danger mr-2"
                (click)="manageAction('block',data)"
        >
          <i class="fa fa-lock" style="margin-right: 10px"></i>
        </button>
        <ng-template #unblockButton>
        <button
                class="btn btn-danger mr-2"
                (click)="manageAction('unblock',data)"
        >
          <i class="fa fa-lock-open" style="margin-right: 10px"></i>
        </button>
        </ng-template>



      </th>
    </tr>
    </tbody>
  </table>

</div>
<div class="d-flex justify-content-between p-2" *ngIf="infoPage.pages > 1">
  <ngb-pagination
            [collectionSize]="infoPage.total"
            [(page)]="infoPage.page"
            [pageSize]="infoPage.itemsPage"
            (pageChange)="changePage()">
  </ngb-pagination>

  <select class="custom-select" style="width: auto" [(ngModel)]="infoPage.itemsPage" (ngModelChange)="changePage()">
    <option [ngValue]="5">5 items per page</option>
    <option [ngValue]="10">10 items per page</option>
    <option [ngValue]="15">15 items per page</option>
  </select>
</div>
